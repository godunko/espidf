name = "espidf"
version = "0.2.0-dev"
website = "https://github.com/godunko/espidf"
description = "Ada/ESP-IDF: common types and utilities for ESP-IDF bindings"
long-description = """
Root crate of the Ada bindings for the Espressif IoT Development Framework (ESP-IDF).

Provides definitions shared by all `espidf_*` binding crates:
- C types used across ESP-IDF APIs (`esp_err_t`, `size_t`, `gpio_num_t`, ...);
- conversion of strings between Ada and C;
- conversion of `esp_err_t` error codes into Ada exceptions.
"""

authors = ["Vadim Godunko"]
maintainers = ["Vadim Godunko <vgodunko@gmail.com>"]
maintainers-logins = ["godunko"]
licenses = "Apache-2.0 WITH LLVM-exception"
tags = ["embedded", "esp32", "espidf"]

[configuration]
generate_ada = false
generate_c = false
generate_gpr = true

[[depends-on]]
a0b_base = "*"
